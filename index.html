<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>帮助中心 · ERGAI ID</title>
    <style>
        /* ===== 字体 & 重置 ===== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Noto+Sans+SC:wght@300..900&display=swap');

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-blue: #0071e3;
            --color-blue-hover: #005bbf;
            --color-step-1: #34c759;
            --color-step-2: #ff3b30;
            --color-step-3: #0071e3;
            --color-step-4: #8e8e93;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 24px 48px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 32px 64px rgba(0, 0, 0, 0.15);
            --radius-card: 48px;
            --radius-step: 24px;
            --radius-btn: 40px;
        }

        body {
            background: #fbfbfd;
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #1c1c1e;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .help-card {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: var(--radius-card);
            padding: 48px 40px 44px;
            box-shadow: var(--shadow-md), 0 4px 16px rgba(0, 0, 0, 0.02);
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            text-align: center;
            transition: all 0.3s ease;
        }

        .help-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 32px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: -0.03em;
            gap: 12px;
            flex-wrap: wrap;
        }

        .help-title .title-main {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0 4px;
        }

        .help-title .brand {
            font-weight: 400;
            color: #6e6e73;
            font-size: 18px;
            margin-left: 2px;
        }

        .contact-buy {
            background: var(--color-blue);
            color: #fff;
            padding: 8px 22px;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 12px rgba(0, 113, 227, 0.3);
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            letter-spacing: -0.01em;
        }
        .contact-buy svg {
            width: 18px;
            height: 18px;
            stroke: #fff;
            fill: none;
            flex-shrink: 0;
        }

        .contact-buy:hover {
            background: var(--color-blue-hover);
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 113, 227, 0.35);
        }

        .contact-buy:active {
            transform: scale(0.95);
            transition-duration: 0.06s;
        }

        .steps-flow {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 28px;
        }

        .step-item {
            background: #ffffff;
            border-radius: var(--radius-step);
            padding: 20px 26px;
            text-decoration: none;
            color: #1c1c1e;
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 100%;
            max-width: 440px;
            cursor: pointer;
            min-height: 68px;
            position: relative;
        }

        .step-item:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 6px 16px rgba(0, 0, 0, 0.02);
        }

        .step-item:active {
            transform: scale(0.97);
            transition-duration: 0.06s;
        }

        .step-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            flex-shrink: 0;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .step-item:hover .step-number {
            transform: scale(1.08);
        }

        .step-green .step-number {
            background: var(--color-step-1);
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.4);
        }
        .step-green:hover {
            border-color: rgba(52, 199, 89, 0.3);
        }

        .step-red .step-number {
            background: var(--color-step-2);
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.4);
        }
        .step-red:hover {
            border-color: rgba(255, 59, 48, 0.3);
        }

        .step-blue .step-number {
            background: var(--color-step-3);
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.4);
        }
        .step-blue:hover {
            border-color: rgba(0, 113, 227, 0.3);
        }

        .step-gray .step-number {
            background: var(--color-step-4);
            box-shadow: 0 2px 8px rgba(142, 142, 147, 0.4);
        }
        .step-gray:hover {
            border-color: rgba(142, 142, 147, 0.3);
        }

        .step-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
            text-align: left;
            min-width: 0;
        }

        .step-content .step-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .step-content .step-desc {
            font-size: 14px;
            color: #86868b;
            font-weight: 400;
        }

        .step-arrow {
            font-size: 16px;
            color: #aeaeb2;
            opacity: 0.3;
            transition: opacity 0.25s ease, transform 0.25s ease;
            flex-shrink: 0;
        }

        .step-item:hover .step-arrow {
            opacity: 0.7;
            transform: translateX(4px);
        }

        .step-connector {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px 0;
            user-select: none;
            opacity: 0.3;
        }

        .step-connector span {
            display: inline-block;
            width: 2px;
            height: 22px;
            background: #d1d1d6;
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        /* ============================================================
                   MODAL 弹窗
                   ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-radius: var(--radius-card);
            padding: 44px 36px 40px;
            box-shadow: var(--shadow-lg), 0 8px 24px rgba(0, 0, 0, 0.05);
            border: 0.5px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            animation: slideUp 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 28px;
            color: #aeaeb2;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .modal-close:hover {
            color: #1c1c1e;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 26px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: -0.03em;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-title svg {
            display: inline-block;
            vertical-align: middle;
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            color: #1c1c1e;
        }

        .modal-sub {
            font-size: 15px;
            color: #86868b;
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.2px;
        }

        .platform-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 8px;
        }

        /* 下载选项弹窗内按钮横向 */
        #downloadOptionsModal .platform-group {
            flex-direction: row;
            flex-wrap: wrap;
            max-width: 340px;
            gap: 12px;
        }
        #downloadOptionsModal .platform-group .btn {
            flex: 1 1 calc(50% - 6px);
            min-width: 100px;
            padding: 14px 10px;
            font-size: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 22px;
            border-radius: var(--radius-btn);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            width: 100%;
            letter-spacing: -0.01em;
            text-decoration: none;
            color: #fff;
        }

        .btn:active {
            transform: scale(0.96);
            transition-duration: 0.06s;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .btn-android {
            background: #34c759;
            box-shadow: 0 2px 16px rgba(52, 199, 89, 0.3);
        }
        .btn-android:hover {
            background: #28a745;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(52, 199, 89, 0.4);
        }
        .btn-android svg path {
            stroke: #fff;
            fill: #fff;
        }

        .btn-ios {
            background: #0071e3;
            box-shadow: 0 2px 16px rgba(0, 113, 227, 0.3);
        }
        .btn-ios:hover {
            background: #005bbf;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 113, 227, 0.4);
        }
        .btn-ios svg path {
            stroke: #fff;
            fill: #fff;
        }

        .btn-option {
            background: var(--color-blue);
            color: #fff;
            box-shadow: 0 2px 16px rgba(0, 113, 227, 0.25);
        }
        .btn-option:hover {
            background: var(--color-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 113, 227, 0.35);
        }
        .btn-option.secondary {
            background: #8e8e93;
            box-shadow: 0 2px 16px rgba(142, 142, 147, 0.25);
        }
        .btn-option.secondary:hover {
            background: #6e6e73;
        }

        /* 联系客服 */
        .contact-block {
            margin-top: 6px;
        }
        .qq-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f5f5f7;
            border-radius: 20px;
            padding: 10px 18px;
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .qq-label {
            font-size: 14px;
            color: #6e6e73;
            font-weight: 500;
        }
        .qq-number {
            font-size: 22px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: 1px;
            background: #fff;
            padding: 2px 16px;
            border-radius: var(--radius-btn);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            font-family: 'Inter', monospace;
        }
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .btn-copy {
            background: var(--color-blue);
            color: #fff;
            box-shadow: 0 2px 16px rgba(0, 113, 227, 0.25);
        }
        .btn-copy:hover {
            background: var(--color-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 113, 227, 0.35);
        }
        .btn-jump {
            background: var(--color-step-1);
            color: #fff;
            box-shadow: 0 2px 16px rgba(52, 199, 89, 0.25);
        }
        .btn-jump:hover {
            background: #28a745;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(52, 199, 89, 0.35);
        }

        /* Toast */
        .copy-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 28px;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 9999;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .help-card { padding: 32px 18px; border-radius: 32px; }
            .help-title { font-size: 26px; }
            .help-title .brand { font-size: 16px; }
            .contact-buy { font-size: 13px; padding: 6px 16px; }
            .step-item { padding: 16px 18px; min-height: 58px; gap: 14px; border-radius: 18px; }
            .step-number { width: 34px; height: 34px; font-size: 14px; }
            .step-content .step-title { font-size: 16px; }
            .step-content .step-desc { font-size: 13px; }
            .modal-card { padding: 36px 20px 32px; border-radius: 32px; }
            .modal-title { font-size: 22px; }
            .qq-number { font-size: 20px; padding: 2px 12px; }
            .btn { font-size: 15px; padding: 13px 18px; }
            #downloadOptionsModal .platform-group .btn {
                flex: 1 1 calc(50% - 6px);
                min-width: 80px;
                padding: 12px 8px;
                font-size: 14px;
            }
        }
        @media (max-width: 400px) {
            .help-title { flex-direction: column; align-items: flex-start; gap: 8px; }
            .contact-buy { align-self: flex-start; }
            #downloadOptionsModal .platform-group .btn { flex: 1 1 100%; }
        }
        @media (max-width: 380px) {
            .help-card { padding: 24px 12px 28px; border-radius: 24px; }
            .step-item { padding: 12px 14px; min-height: 50px; gap: 10px; border-radius: 14px; }
            .step-number { width: 28px; height: 28px; font-size: 12px; }
            .step-content .step-title { font-size: 14px; }
            .step-content .step-desc { font-size: 12px; }
            .modal-card { padding: 28px 14px 24px; border-radius: 24px; }
            .qq-number { font-size: 17px; padding: 2px 10px; }
            .btn { font-size: 14px; padding: 11px 14px; }
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1c1c1e; }
            .help-card { background: rgba(44, 44, 46, 0.85); border-color: rgba(255,255,255,0.06); }
            .help-title { color: #f5f5f7; }
            .help-title .brand { color: #aeaeb2; }
            .step-item { background: rgba(44,44,46,0.9); color: #f5f5f7; border-color: rgba(255,255,255,0.06); }
            .step-content .step-desc { color: #aeaeb2; }
            .step-arrow { color: #636366; }
            .modal-card { background: rgba(44,44,46,0.95); border-color: rgba(255,255,255,0.08); }
            .modal-title { color: #f5f5f7; }
            .modal-title svg { color: #f5f5f7; }
            .modal-sub { color: #aeaeb2; }
            .qq-row { background: rgba(58,58,60,0.8); border-color: rgba(255,255,255,0.06); }
            .qq-number { background: rgba(44,44,46,0.9); color: #f5f5f7; }
            .qq-label { color: #aeaeb2; }
            .modal-close { color: #636366; }
            .modal-close:hover { color: #f5f5f7; }
            .contact-buy { border-color: rgba(255,255,255,0.15); }
            .step-connector span { background: #48484a; }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="copyToast" class="copy-toast">
        <svg class="toast-icon-success" width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M43 11L16.875 37L5 25.1818" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="toast-text">QQ号已复制</span>
    </div>

    <!-- ===== 主页面 ===== -->
    <div class="help-card">
        <div class="help-title">
            <span class="title-main">帮助中心 <span class="brand">· ERGAI ID</span></span>
            <button class="contact-buy" id="openContactBtn">
                <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M44 6H4V36H13V41L23 36H44V6Z" stroke="#fff" stroke-width="4"/><path d="M14 19.5V22.5" stroke="#fff" stroke-width="4"/><path d="M24 19.5V22.5" stroke="#fff" stroke-width="4"/><path d="M34 19.5V22.5" stroke="#fff" stroke-width="4"/></svg>
                联系购买
            </button>
        </div>
        <div class="steps-flow">
            <div class="step-item step-green" id="stepDownload">
                <div class="step-number">1</div>
                <div class="step-content"><span class="step-title">下载软件</span><span class="step-desc">客户端 · 工具下载</span></div>
                <span class="step-arrow">↗</span>
            </div>
            <div class="step-connector"><span></span></div>
            <a href="#" class="step-item step-red" id="linkLogin" target="_blank" rel="noopener noreferrer">
                <div class="step-number">2</div>
                <div class="step-content"><span class="step-title">登录教程</span><span class="step-desc">账号注册 · 权限指南</span></div>
                <span class="step-arrow">↗</span>
            </a>
            <div class="step-connector"><span></span></div>
            <a href="#" class="step-item step-blue" id="linkChinese" target="_blank" rel="noopener noreferrer">
                <div class="step-number">3</div>
                <div class="step-content"><span class="step-title">更改中文</span><span class="step-desc">切换语言 · 中文设置</span></div>
                <span class="step-arrow">↗</span>
            </a>
            <div class="step-connector"><span></span></div>
            <a href="#" class="step-item step-gray" id="linkFaq" target="_blank" rel="noopener noreferrer">
                <div class="step-number">4</div>
                <div class="step-content"><span class="step-title">问题总和</span><span class="step-desc">常见问题 · 汇总解答</span></div>
                <span class="step-arrow">↗</span>
            </a>
        </div>
    </div>

    <!-- ===== Modal 1: 平台选择 ===== -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal-card">
            <button class="modal-close" id="closeDownloadModal">✕</button>
            <div class="modal-title">
                <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M41.4004 11.551L36.3332 5H11.6666L6.58398 11.551" stroke="currentColor" stroke-width="4"/><path d="M6 13C6 11.8954 6.89543 11 8 11H40C41.1046 11 42 11.8954 42 13V40C42 41.6569 40.6569 43 39 43H9C7.34315 43 6 41.6569 6 40V13Z" stroke="currentColor" stroke-width="4"/><path d="M32 27L24 35L16 27" stroke="currentColor" stroke-width="4"/><path d="M23.9917 19V35" stroke="currentColor" stroke-width="4"/></svg>
                下载软件
            </div>
            <div class="modal-sub">选择您的平台，开始使用</div>
            <div class="platform-group">
                <a href="#" class="btn btn-android" id="downloadAndroid">
                    <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M43.9011 36H4.09863C5.10208 25.8934 13.6292 18 23.9999 18C34.3706 18 42.8977 25.8934 43.9011 36Z" stroke="#fff" stroke-width="4"/><path d="M14 20L10 13" stroke="#fff" stroke-width="4"/><path d="M33 20L37 13" stroke="#fff" stroke-width="4"/><circle cx="15" cy="29" r="2" fill="#fff"/><circle cx="33" cy="29" r="2" fill="#fff"/></svg>
                    安卓下载
                </a>
                <a href="#" class="btn btn-ios" id="downloadIOS">
                    <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M23.9111 11.3176C23.9931 9.08606 24.6201 7.12594 25.7772 5.4874C26.9402 3.84056 28.8628 2.6707 31.4945 2.00781C31.512 2.08885 31.5302 2.16994 31.5491 2.25072V2.67472C31.5491 3.63616 31.3159 4.73862 30.8556 5.95127C30.3732 7.12541 29.6193 8.23048 28.618 9.22782C27.6815 10.1066 26.8151 10.6884 26.0494 10.9514C25.7966 11.0269 25.45 11.1012 25.0314 11.1681C24.6591 11.2261 24.2856 11.276 23.9111 11.3176Z" fill="#fff"/><path d="M24.3502 14.629C21.3775 14.629 19.3136 11.9999 16.3813 11.9999C13.4491 11.9999 7.4082 14.6951 7.4082 23.9999C7.4082 33.3047 12.7726 39.2999 13.3726 39.9999C13.9725 40.7 15.3601 42.4994 17.5098 42.4994C19.6596 42.4994 22.0131 40.7902 24.3502 40.7902C26.6872 40.7902 29.6288 42.4994 31.5492 42.4994C33.4696 42.4994 34.2595 41.7165 35.5665 40.3662C36.8734 39.0159 39.3663 34.8952 40.2369 32.422C38.8029 31.5684 35.0021 29.2511 35.0021 23.9999C35.0021 20.4992 36.2814 17.5909 38.8401 15.2752C37.1615 13.0917 35.2147 11.9999 32.9996 11.9999C29.6769 11.9999 27.3229 14.629 24.3502 14.629Z" stroke="#fff" stroke-width="4"/></svg>
                    苹果下载

    <div class="modal-overlay" id="contactModal">

                联系客服
            </div>
            <div class="modal-sub">添加客服QQ，获取更多帮助</div>
            <div class="contact-block">
                <div class="qq-row"><span class="qq-label">QQ</span><span class="qq-number" id="qqNumberDisplay">2940926489</span></div>
                <div class="action-group">
                    <button class="btn btn-copy" id="copyBtn"><svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M13 12.4316V7.8125C13 6.2592 14.2592 5 15.8125 5H40.1875C41.7408 5 43 6.2592 43 7.8125V32.1875C43 33.7408 41.7408 35 40.1875 35H35.5163" stroke="#fff" stroke-width="4"/><path d="M32.1875 13H7.8125C6.2592 13 5 14.2592 5 15.8125V40.1875C5 41.7408 6.2592 43 7.8125 43H32.1875C33.7408 43 35 41.7408 35 40.1875V15.8125C35 14.2592 33.7408 13 32.1875 13Z" stroke="#fff" stroke-width="4"/></svg>复制 QQ 号</button>
                    <button class="btn btn-jump" id="jumpBtn">一键跳转 <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M41.9999 24H5.99994" stroke="#fff" stroke-width="4"/><path d="M30 12L42 24L30 36" stroke="#fff" stroke-width="4"/></svg></button>

    <!-- ===== Modal 3: 下载选项（动态变化） ===== -->
    <div class="modal-overlay" id="downloadOptionsModal">
        <div class="modal-card">
            <button class="modal-close" id="closeOptionsModal">✕</button>
            <div class="modal-title" id="optionsTitle">选择下载渠道</div>
            <div class="modal-sub" id="optionsSub">请选择您需要的下载方式</div>
            <div class="platform-group">
                <button class="btn btn-option" id="optionOfficial">TG-X下载（推荐）</button>
                <button class="btn btn-option secondary" id="optionBackup">IME下载</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ======================== 配置中心 ========================
            const CONFIG = {
                qqNumber: '2940926489',
                qqJumpUrl: 'https://qm.qq.com/q/Ykocx4l8gc',
                links: {
                    login: 'https://doc.sff05.cc/',
                    chinese: 'https://t.me/setlanguage/zhcncc',
                    faq: 'https://help.tgqqq.com/'
                },
                downloads: {
                    android: {
                        official: 'https://ergai.lanzouq.com/iIo32429ghdc',
                        backup: 'https://imem.app/android'
                    },
                    ios: {
                        official: 'https://apps.apple.com/us/app/nicegram-ai-x-dual-telegram/id1608870673',
                        backup: 'https://apps.apple.com/us/app/ime-ai-messenger-for-telegram/id1450480822'
                    }
                }
            };

            // ======================== DOM 引用 ========================
            const $ = (s) => document.querySelector(s);
            const els = {
                stepDownload: $('#stepDownload'),
                login: $('#linkLogin'),
                chinese: $('#linkChinese'),
                faq: $('#linkFaq'),
                downloadModal: $('#downloadModal'),
                contactModal: $('#contactModal'),
                optionsModal: $('#downloadOptionsModal'),
                openContactBtn: $('#openContactBtn'),
                closeDownloadModal: $('#closeDownloadModal'),
                closeContactModal: $('#closeContactModal'),
                closeOptionsModal: $('#closeOptionsModal'),
                copyBtn: $('#copyBtn'),
                jumpBtn: $('#jumpBtn'),
                toast: $('#copyToast'),
                qqDisplay: $('#qqNumberDisplay'),
                downloadAndroid: $('#downloadAndroid'),
                downloadIOS: $('#downloadIOS'),
                optionOfficial: $('#optionOfficial'),
                optionBackup: $('#optionBackup'),
                optionsTitle: $('#optionsTitle'),
                optionsSub: $('#optionsSub')
            };

            // ======================== 工具函数 ========================
            function setupLinks() {
                const map = { login: CONFIG.links.login, chinese: CONFIG.links.chinese, faq: CONFIG.links.faq };
                Object.keys(map).forEach(key => {
                    const el = els[key];
                    if (el) { el.href = map[key]; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
                });
            }

            let toastTimer = null;

            function showToast(msg, isWarning) {
                const el = els.toast;
                const icon = isWarning ?
                    '<svg class="toast-icon-warning" width="24" height="24" viewBox="0 0 48 48" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M24 5L2 43H46L24 5Z" stroke="#ff9500" stroke-width="4"/><path d="M24 35V36" stroke="#ff9500" stroke-width="4"/><path d="M24 19.0005L24.0083 29" stroke="#ff9500" stroke-width="4"/></svg>' :
                    '<svg class="toast-icon-success" width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M43 11L16.875 37L5 25.1818" stroke="#34c759" stroke-width="4"/></svg>';
                el.innerHTML = icon + ' <span class="toast-text">' + msg + '</span>';
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
            }

            function copyText(text) {
                if (!text) return;
                if (navigator.clipboard?.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast('QQ号 ' + text + ' 已复制'))
                        .catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const input = document.createElement('input');
                input.value = text;
                input.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
                document.body.appendChild(input);
                input.select();
                try {
                    const ok = document.execCommand('copy');
                    showToast(ok ? 'QQ号 ' + text + ' 已复制' : '复制失败，请手动复制', !ok);
                } catch {
                    showToast('复制失败，请手动复制', true);
                }
                document.body.removeChild(input);
            }

            function openModal(modal) {
                if (modal) {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }

            function closeModal(modal) {
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            function jumpTo(url) {
                if (url) window.open(url, '_blank');
            }

            // ======================== 核心逻辑 ========================
            let currentPlatform = 'android';

            function openDownloadOptions(platform) {
                // 防止重复点击导致状态混乱
                if (els.optionsModal.classList.contains('active')) {
                    return;
                }

                currentPlatform = platform;
                const config = CONFIG.downloads[platform];

                // ===== 根据平台独立设置标题、副标题、按钮文字 =====
                if (platform === 'android') {
                    els.optionsTitle.textContent = 'Android下载链接';
                    els.optionsSub.textContent = '推荐TG-X，密码：0000';
                    els.optionOfficial.textContent = 'TG-X下载（推荐）';
                    els.optionBackup.textContent = 'IME下载';
                } else {
                    els.optionsTitle.textContent = 'iOS下载链接';
                    els.optionsSub.textContent = '优先推荐安卓，NG不行用IME';
                    els.optionOfficial.textContent = 'NG下载（推荐）';
                    els.optionBackup.textContent = 'IME下载';
                }

                // 存储对应的下载链接
                els.optionOfficial.dataset.url = config.official;
                els.optionBackup.dataset.url = config.backup;

                // 先关闭平台选择弹窗，再打开选项弹窗
                closeModal(els.downloadModal);
                // 延迟一点点再打开，确保上一个弹窗完全关闭
                requestAnimationFrame(() => {
                    openModal(els.optionsModal);
                });
            }

            // ======================== 事件绑定 ========================
            function init() {
                setupLinks();
                if (els.qqDisplay) els.qqDisplay.textContent = CONFIG.qqNumber;

                // 安卓 / 苹果 点击 -> 打开选项弹窗
                els.downloadAndroid.addEventListener('click', (e) => {
                    e.preventDefault();
                    openDownloadOptions('android');
                });
                els.downloadIOS.addEventListener('click', (e) => {
                    e.preventDefault();
                    openDownloadOptions('ios');
                });

                // 步骤1 -> 平台选择弹窗
                els.stepDownload.addEventListener('click', (e) => {
                    e.preventDefault();
                    openModal(els.downloadModal);
                });

                // 联系购买
                els.openContactBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    openModal(els.contactModal);
                });

                // 关闭平台选择
                els.closeDownloadModal.addEventListener('click', () => closeModal(els.downloadModal));
                els.downloadModal.addEventListener('click', (e) => {
                    if (e.target === els.downloadModal) closeModal(els.downloadModal);
                });

                // 关闭联系客服
                els.closeContactModal.addEventListener('click', () => closeModal(els.contactModal));
                els.contactModal.addEventListener('click', (e) => {
                    if (e.target === els.contactModal) closeModal(els.contactModal);
                });

                // ===== 选项弹窗：关闭 -> 回到平台选择 =====
                const goBackToPlatform = () => {
                    closeModal(els.optionsModal);
                    // 延迟确保弹窗完全关闭后再打开
                    requestAnimationFrame(() => {
                        openModal(els.downloadModal);
                    });
                };

                els.closeOptionsModal.addEventListener('click', goBackToPlatform);
                els.optionsModal.addEventListener('click', (e) => {
                    if (e.target === els.optionsModal) goBackToPlatform();
                });

                // ESC 键智能返回
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (els.optionsModal.classList.contains('active')) {
                            goBackToPlatform();
                        } else if (els.downloadModal.classList.contains('active')) {
                            closeModal(els.downloadModal);
                        } else if (els.contactModal.classList.contains('active')) {
                            closeModal(els.contactModal);
                        }
                    }
                });

                // 复制 & 跳转 QQ
                els.copyBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    copyText(CONFIG.qqNumber);
                });
                els.jumpBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.open(CONFIG.qqJumpUrl, '_blank');
                    copyText(CONFIG.qqNumber);
                });

                // 下载选项按钮跳转
                els.optionOfficial.addEventListener('click', (e) => {
                    e.preventDefault();
                    const url = e.currentTarget.dataset.url;
                    if (url) jumpTo(url);
                });
                els.optionBackup.addEventListener('click', (e) => {
                    e.preventDefault();
                    const url = e.currentTarget.dataset.url;
                    if (url) jumpTo(url);
                });

                console.log('✅ 帮助中心已加载，下载链接已配置');
                console.log('安卓官方:', CONFIG.downloads.android.official);
                console.log('安卓备用:', CONFIG.downloads.android.backup);
                console.log('苹果官方:', CONFIG.downloads.ios.official);
                console.log('苹果备用:', CONFIG.downloads.ios.backup);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
